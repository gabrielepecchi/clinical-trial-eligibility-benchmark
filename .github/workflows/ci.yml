name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run CI-safe tests
        run: |
          PYTHONPATH=. python -m pytest \
            tests/test_criteria_parser.py \
            tests/test_evidence_span.py \
            tests/test_models.py \
            tests/test_rule_matcher.py \
            tests/test_rule_matcher_age.py \
            tests/test_rule_matcher_medication.py \
            tests/test_rule_matcher_procedure.py \
            tests/test_rule_matcher_unclear_logic.py \
            tests/test_unit_conversion.py
